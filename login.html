<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MovieLand</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url(images/about_bg.jpg);
            background-size: cover;
            background-position: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            width: 400px;
            max-width: 100%;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .login-box .logo {
            display: inline-block;
            color: #e50914;
            font-size: 30px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .login-box h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-input {
            text-align: left;
            margin-bottom: 15px;
        }

        .login-input label {
            display: block;
            color: #444;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .login-box input[type="email"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        .login-box input:focus {
            border-color: #e50914;
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 12px;
            gap: 10px;
        }

        .remember label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remember input {
            accent-color: #e50914;
        }

        .remember a {
            color: #e50914;
            text-decoration: none;
        }

        .remember a:hover {
            text-decoration: underline;
        }

        .login-box button {
            width: 100%;
            margin: 15px 0;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #e50914;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #b80710;
        }

        .login-box .signup {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .signup a {
            color: #e50914;
            text-decoration: none;
            font-weight: 600;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .login-box .back-home {
            display: inline-block;
            margin-top: 10px;
            color: #e50914;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 25px 20px;
            }

            .remember {
                font-size: 11px;
            }
        }
    </style>

</head>

<body class="login-page">

    <div class="login-box">

        <a href="index.html" class="logo">
             MovieLand!
        </a>

        <h2>Welcome Back!</h2>

        <p>Login to your MovieLand account</p>

        <form action="#" method="post" onsubmit="return loginUser()">

            <div class="login-input">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="login-input">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="remember">

                <label>
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <a href="#" onclick="forgotPassword(event)">
                    Forgot Password?
                </a>

            </div>

            <button type="submit" class="login-submit">
                Login
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="registration.html">Sign Up</a>
        </p>

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

    <script>
        function loginUser() {
            alert("Login form submitted successfully!");

            return false;
        }

        function forgotPassword(event) {
            event.preventDefault();
            alert("Please contact MovieLand support to reset your password.");
        }
    </script>

</body>
</html>
